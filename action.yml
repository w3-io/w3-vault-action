name: "W3 Vault Action"
description: "Deposit and withdraw USDC from W3 Yelay vaults, with cross-chain CCTP bridging"
author: "w3-io"

inputs:
  command:
    description: >
      Operation to perform.
      Submitting (signs + broadcasts via the W3 bridge):
        deposit, redeem, status, withdraw-oldest, withdraw-by-id, list-deposits.
      Intent-building (returns unsigned tx payload for external signers):
        build-deposit, build-approve.
    required: true

  # Deposit inputs
  po-id:
    description: "Purchase order identifier for deposit tracking"
    required: false
  amount:
    description: 'USDC amount as string (e.g. "1000.00"). For build-approve, MUST be exact (max-uint disallowed).'
    required: false
  source-chain:
    description: "Source chain for USDC (default: base). For cross-chain, CCTP bridges to Base first."
    required: false
    default: "base"

  # Intent-builder inputs (build-deposit / build-approve)
  receiver:
    description: "Receiver address. Required by build-deposit. Defaults to signer for direct deposit/redeem."
    required: false
  spender:
    description: "Spender address for build-approve. Defaults to the configured environment's vault."
    required: false

  # Environment
  environment:
    description: >
      Vault environment: testing (Base, projectId=1), base-production
      (Base, projectId=1), ethereum-production (Ethereum, projectId=30301
      — the W3 Vault that payments.w3.io reads APY from), or production
      (alias of base-production, for backwards compatibility).
    required: false
    default: "testing"

  # CCTP config (for cross-chain deposits)
  sandbox:
    description: "Use Circle IRIS sandbox for attestation (default: false)"
    required: false
    default: "false"

  # Pagination (for list-deposits)
  from:
    description: "Start index for deposit pagination (default: 0)"
    required: false
    default: "0"
  to:
    description: "End index for deposit pagination (default: 10)"
    required: false
    default: "10"

outputs:
  result:
    description: "JSON result of the operation"

runs:
  using: "node24"
  main: "dist/index.js"
